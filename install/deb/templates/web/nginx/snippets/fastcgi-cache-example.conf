# Composable feature: FastCGI micro-caching for this domain.
# See snippets/README.md for how to enable this for a domain.
#
# References the "microcache" FastCGI cache zone already declared
# globally in Hestia's own shipped nginx.conf
# (fastcgi_cache_path ... keys_zone=microcache:10m ...) — this snippet
# adds nothing new at the http level, it only turns caching ON for one
# domain's already-existing "location ~ [^/]\.php(/|$)" block, which is
# exactly the include point that block already exposes
# (nginx.fastcgi_cache.conf*, present in every php-fpm-backed template,
# including wordpress.tpl/.stpl, since before this sprint).
#
# NOT full-page caching: only the FastCGI (PHP-FPM) response is cached,
# per the existing global $no_cache map/if-blocks already present in
# wordpress.tpl (skips caching for wp-admin, the REST API, cart/checkout
# pages, and any logged-in/cart-bearing cookie) — those existing rules
# are untouched by enabling this file. Full-page WordPress caching
# (page-cache plugins, edge caching) is explicitly out of this sprint's
# scope.
#
# To enable: copy this file's content to
#   nginx.fastcgi_cache.conf_<name>
# in the domain's own conf directory (NOT nginx.features.conf_* — this
# uses the template's existing, dedicated fastcgi-cache include point).

fastcgi_cache            microcache;
fastcgi_cache_valid      200 301 302 10m;
fastcgi_cache_bypass     $no_cache;
fastcgi_no_cache         $no_cache;
