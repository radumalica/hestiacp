# WordPress authentication-endpoint rate-limit zone (Sprint 9A —
# dev-docs/nginx/NGINX_WORDPRESS_HARDENING_IMPLEMENTATION.md). Extends the
# composable Nginx feature architecture from Sprint 8
# (dev-docs/nginx/NGINX_SECURITY_EXTENSIBILITY_IMPLEMENTATION.md) and the
# general-purpose zone in hestia-rate-limit.conf with a zone scoped
# specifically to WordPress's two classic brute-force/abuse targets:
# wp-login.php and xmlrpc.php (XML-RPC, used for pingback-based amplification
# and password-guessing when enabled).
#
# `limit_req_zone` and `map` can only be declared in Nginx's http{} context,
# never inside a per-domain server{} block — this file is picked up by the
# wildcard "include /etc/nginx/conf.d/*.conf;" already present at the end of
# the http{} block in Hestia's own shipped nginx.conf (this file is new;
# that existing include line and nginx.conf itself were not modified to add
# it). This file is installed unconditionally by the Hestia installer/
# upgrade scripts (see install/hst-install-*.sh and
# install/upgrade/versions/1.10.0.sh) because every WordPress template
# references its zone unconditionally (see below) — unlike the fully
# opt-in general-purpose zone, this one must always exist or every
# WordPress domain would fail `nginx -t`.
#
# How the scoping works: rather than adding a second `location` block per
# WordPress template that would have to duplicate the fastcgi_pass wiring
# of the existing general PHP-execution location (and then silently drift
# out of sync with it over time), the zone's key is produced by a `map` on
# $request_uri. Requests to any path other than /wp-login.php or
# /xmlrpc.php map to an empty key, and Nginx's limit_req module does not
# rate-limit requests whose key evaluates to an empty string — so this has
# zero effect on any other request. Each WordPress template adds exactly
# one line (`limit_req zone=hestia_wp_auth_rl burst=... nodelay;`) inside
# its existing general PHP location; verified with a live nginx instance
# (not just `nginx -t`) that requests to /index.php are never limited while
# requests to /wp-login.php are limited once the burst is exhausted — see
# test/nginx/test_wordpress_security_profile.sh.
#
# Key: $binary_remote_addr, only for the two matched paths (per client IP —
# consistent with hestia-rate-limit.conf's general zone).
#
# 10m zone size and the rate/burst below are OPERATIONAL DEFAULTS, not a
# claimed "industry standard". rate=2r/s with burst=15 nodelay allows a
# generous ~17 rapid requests before throttling engages, then a sustained
# 2 requests/second per IP indefinitely — comfortably above real login/
# 2FA/redirect-chain traffic patterns from a single visitor, while still
# meaningfully slowing an automated brute-force or XML-RPC pingback-abuse
# script, which typically drives far higher sustained rates. Legitimate
# XML-RPC users (e.g. the WordPress mobile app, Jetpack) are essentially
# never issuing more than ~2 requests/second sustained from one IP either.
# If this ever proves too strict for a specific site, the fix is to edit
# this shipped file directly (it is not a per-domain template) — it is not
# rendered through Hestia's %var% substitution pipeline.
map $request_uri $hestia_wp_auth_rl_key {
	default                "";
	~*^/wp-login\.php       $binary_remote_addr;
	~*^/xmlrpc\.php         $binary_remote_addr;
}
limit_req_zone $hestia_wp_auth_rl_key zone=hestia_wp_auth_rl:10m rate=2r/s;
