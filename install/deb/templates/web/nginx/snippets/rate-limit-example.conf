# Composable feature: apply a request-rate limit to a domain.
# See snippets/README.md for how to enable this for a domain.
#
# `limit_req_zone` (the zone declaration itself) can only be declared in
# Nginx's http{} context, never inside a per-domain server{} block —
# this is a hard Nginx constraint, not a Hestia limitation. The zone
# declaration therefore lives in
# install/deb/nginx/hestia-rate-limit.conf, a single, global,
# ADDITIVE file picked up by the wildcard
# "include /etc/nginx/conf.d/*.conf;" Hestia's own shipped nginx.conf
# already has at the end of its http{} block — no existing file was
# edited to add it, and declaring an unused zone changes nothing for
# any domain (a zone only has an effect where a `limit_req` directive
# actually references it).
#
# This file is the per-domain HALF: it references that zone (by the
# name/key/rate declared there — see that file's own comment) and
# applies it. Scoped to the whole domain (server context) here,
# deliberately: `limit_req` is valid in server/location context, but a
# path-scoped example (e.g. only /wp-login.php) would need its own
# fastcgi_pass/backend wiring duplicated from the base template's own
# %backend_lsnr% value — a value only Hestia's template renderer
# resolves, never available to a raw, non-rendered snippet like this
# one (see dev-docs/nginx/NGINX_SECURITY_EXTENSIBILITY_IMPLEMENTATION.md
# "Known limitations" for why per-location rate limiting on a
# PHP-handled path is deferred rather than shipped half-working here).
#
# No numeric "requests per second"/"burst" value is asserted as a
# recommendation — pick values appropriate to the specific site, copy
# this file, and adjust them; do not use it unmodified.
#
# To enable: copy (and adjust) this file's content to
#   nginx.features.conf_rate-limit  (or nginx.features.ssl.conf_rate-limit)
# in the domain's own conf directory.

limit_req zone=hestia_domain_rl burst=20 nodelay;
