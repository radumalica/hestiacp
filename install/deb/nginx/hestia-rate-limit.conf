# Global rate-limit zone declaration for the composable Nginx feature
# architecture — see
# dev-docs/nginx/NGINX_SECURITY_EXTENSIBILITY_IMPLEMENTATION.md and
# install/deb/templates/web/nginx/snippets/rate-limit-example.conf.
#
# `limit_req_zone` can only be declared in Nginx's http{} context, never
# inside a per-domain server{} block — this file is picked up by the
# wildcard "include /etc/nginx/conf.d/*.conf;" already present at the
# end of the http{} block in Hestia's own shipped nginx.conf (this file
# is new; that existing include line and nginx.conf itself were not
# modified to add it).
#
# Declaring this zone has NO effect on any domain by itself — a zone
# only does something where a `limit_req zone=hestia_domain_rl ...;`
# directive actually references it (see the example snippet above).
# Installing this file therefore changes nothing about existing domain
# behavior; it only makes the zone available for a domain to opt into.
#
# Key: $binary_remote_addr (per client IP — the standard, most common
# Nginx rate-limiting key; a compact binary form rather than the full
# string form, to keep the zone's memory footprint small).
#
# 10m zone size and the request rate below are OPERATIONAL DEFAULTS for
# this shared zone, not a claimed "industry standard" and not a
# per-endpoint recommendation — a 10m zone holds roughly 160,000 tracked
# IP addresses at Nginx's own ~64-byte-per-state sizing, ample headroom
# for a typical single-server Hestia install. The 10r/s rate is a
# deliberately generous, conservative starting point (rejects only
# genuinely excessive request volume, not a real user clicking around a
# site) — every consuming location/domain still chooses its own `burst`
# value at the point it references this zone, so the effective
# per-endpoint behavior is NOT fixed by this file alone.
limit_req_zone $binary_remote_addr zone=hestia_domain_rl:10m rate=10r/s;
