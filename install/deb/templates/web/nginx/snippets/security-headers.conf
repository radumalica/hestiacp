# Composable feature: baseline security response headers.
# See snippets/README.md for how to enable this for a domain.
#
# Deliberately opt-in, not baked into any base template — these are
# response headers, evaluated for every request regardless of
# application, so enabling them globally without per-site verification
# risks breaking an embed/iframe integration (X-Frame-Options) or a
# third-party script/font/analytics integration a site owner already
# relies on. Nothing here is WordPress-specific.
#
# No Content-Security-Policy directive is included here. A CSP that
# actually matches a site's real script/style/font/image origins cannot
# be determined generically — WordPress alone commonly loads assets from
# a theme, several plugins, Google Fonts, a CDN, and inline
# script/style output from page builders and WooCommerce. A wrong CSP
# silently breaks functionality rather than failing loudly, which is
# exactly the "potentially breaking policy without compatibility
# evidence" this sprint was told not to enable by default. Add a CSP
# here yourself, per site, only after testing it in
# `Content-Security-Policy-Report-Only` mode against that specific
# site's actual asset origins.

add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
# X-XSS-Protection is deprecated and its legacy browser-side filter has
# its own history of vulnerabilities; modern guidance (OWASP, MDN) is to
# explicitly disable it rather than enable it.
add_header X-XSS-Protection "0" always;

# X-Frame-Options is intentionally NOT enabled here. It breaks any
# legitimate iframe embed of the site (common for page-builder previews,
# some payment/checkout widgets, and sites that are themselves embedded
# elsewhere) unless set carefully. Uncomment only after confirming the
# site never needs to be framed by itself or a trusted third party:
# add_header X-Frame-Options "SAMEORIGIN" always;
