# Extension point: ModSecurity / OWASP CRS / a future WAF provider.
#
# NOT USABLE AS SHIPPED. Confirmed by source inspection during Sprint 8
# (dev-docs/nginx/NGINX_SECURITY_EXTENSIBILITY_IMPLEMENTATION.md): this
# repository's installer does not install the Nginx ModSecurity dynamic
# module (`ngx_http_modsecurity_module`), any ModSecurity package, or
# the OWASP Core Rule Set, on either the panel's own bundled Nginx
# (used only for the control panel itself, port 8083) or the system
# Nginx used for hosted domains. If the two directives below are
# uncommented without that module installed, Nginx will fail to start
# ("unknown directive") — this is exactly the STOP condition this
# sprint's own task explicitly calls out ("required Nginx/ModSecurity
# functionality is unavailable... document the dependency and stop that
# part rather than inventing it").
#
# This file exists to document WHERE this integration plugs into the
# architecture once that dependency is added by a future sprint:
#
#   1. Install the ngx_http_modsecurity_module package for the system
#      Nginx build in use (varies by distro/Nginx source — an installer
#      change, out of this sprint's scope).
#   2. Vendor or reference an OWASP CRS ruleset (this repository does
#      not vendor OWASP CRS itself — see the doc's "Deferred work").
#   3. Uncomment the two directives below, adjusting the rules-file path
#      to wherever that ruleset is installed.
#   4. Enable this file the same way as any other feature snippet — see
#      snippets/README.md.
#
# modsecurity on;
# modsecurity_rules_file /etc/nginx/modsecurity/main.conf;
